manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: gpeye
      url-base: https://github.com/GPeye
  projects:
    - name: eyelash_sofle
      url: https://github.com/a741725193/zmk-sofle
      revision: refactor
    - name: mario-peripheral-animation
      remote: gpeye
      revision: main 
    - name: zmk
      remote: zmkfirmware
      # Pinned to the commit before ZMK's "Move to zephyr v4.1" (#3060), which
      # requires boards to migrate to the new board.yml/HWMv2 format. Our
      # custom eyelash_sofle board (boards/arm/eyelash_sofle) still uses the
      # old Kconfig.board/board.cmake format, so tracking main breaks the build.
      # See: https://zmk.dev/blog/2025/12/09/zephyr-4-1
      revision: abb64ba316c29caddc49727ca2cac2f0ed5970c7
      import: app/west.yml
  self:
    path: config
